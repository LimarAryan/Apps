<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Focus Timer</h1>
      <p class="subtitle">Run focused sessions and short breaks.</p>

      <section class="timer-card" aria-live="polite">
        <p id="modeLabel" class="mode-label">Focus session</p>
        <p id="timeDisplay" class="time-display">25:00</p>
      </section>

      <section class="controls" aria-label="Timer controls">
        <button id="startPauseBtn">Start</button>
        <button id="resetBtn" class="secondary">Reset</button>
        <button id="switchBtn" class="secondary">Switch Mode</button>
      </section>

      <section class="settings" aria-label="Timer settings">
        <label for="focusInput">Focus (minutes)</label>
        <input id="focusInput" type="number" min="1" max="90" value="25" />

        <label for="breakInput">Break (minutes)</label>
        <input id="breakInput" type="number" min="1" max="30" value="5" />
      </section>

      <p id="statusMessage" class="status-message">Ready when you are.</p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
